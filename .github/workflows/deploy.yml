name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Test and Build Stage
  test-and-build:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            
      - name: Install server dependencies
        run: cd server && npm ci
        
      - name: Install client dependencies  
        run: cd client && npm ci
        
      - name: Run server tests
        run: cd server && npm test
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/leadflow_test
          JWT_SECRET: test_secret_for_ci
          JWT_REFRESH_SECRET: test_refresh_secret_for_ci
          
      - name: Build client
        run: cd client && npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com/api
          
      - name: Test deployment health
        run: |
          echo "Build verification completed successfully"
          echo "✅ Server tests passed"
          echo "✅ Client built successfully"

  # Deploy to Vercel (main branch only)
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy Backend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}
          working-directory: ./server
          vercel-args: '--prod'
          
      - name: Deploy Frontend to Vercel  
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}
          working-directory: ./client
          vercel-args: '--prod'

  # Post-deployment verification
  verify-deployment:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Test deployment endpoints
        run: |
          node scripts/test-deployment.js ${{ secrets.BACKEND_URL }} ${{ secrets.FRONTEND_URL }}
        continue-on-error: true
        
      - name: Deployment summary
        run: |
          echo "🚀 Deployment completed!"
          echo "Backend: ${{ secrets.BACKEND_URL }}"
          echo "Frontend: ${{ secrets.FRONTEND_URL }}"
          echo "Status: Check logs above for health verification"