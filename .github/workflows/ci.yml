name: CI — LeadFlow CRM

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. Lint
  # ─────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - run: cd client && npm run lint

  # ─────────────────────────────────────────
  # 2. Backend tests  (real mongo service — no binary download)
  # ─────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      # Pin mongodb-memory-server to use localhost mongo instead of downloading binary
      - name: Install server deps
        run: cd server && npm ci

      - name: Run backend tests
        run: cd server && npm test -- --coverage
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/leadflow_test
          JWT_SECRET: ci_jwt_secret_at_least_32_chars_long
          JWT_REFRESH_SECRET: ci_refresh_secret_different_value_32c
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          # Tell mongodb-memory-server to use the service container instead
          MONGOMS_DISABLE_POSTINSTALL: "1"

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/coverage/

  # ─────────────────────────────────────────
  # 3. Frontend tests
  # ─────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - name: Run frontend tests
        run: cd client && npm run test:coverage
        env:
          VITE_API_BASE_URL: http://localhost:5000/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: client/coverage/

  # ─────────────────────────────────────────
  # 4. Build
  # ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - name: Build frontend
        run: cd client && npm run build
        env:
          VITE_API_BASE_URL: https://crm-dashboard-seven-mu.vercel.app/api
      - name: Verify build
        run: |
          test -f client/dist/index.html || (echo "❌ Build missing index.html" && exit 1)
          echo "✅ Build OK — $(ls client/dist/assets/ | wc -l) assets"
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 3

  # ─────────────────────────────────────────
  # 5. Deploy  (main branch only, skips gracefully if secrets missing)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⚠️  VERCEL_TOKEN not set — skipping automated deploy"
            echo "   Deploy manually: cd server && vercel --prod"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Vercel CLI
        if: steps.check.outputs.skip == 'false'
        run: npm install -g vercel@latest

      - name: Deploy backend
        if: steps.check.outputs.skip == 'false'
        run: |
          cd server
          vercel --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes 2>&1 | tail -5
        continue-on-error: true

      - name: Deploy frontend
        if: steps.check.outputs.skip == 'false'
        run: |
          cd client
          vercel --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --yes 2>&1 | tail -5
        continue-on-error: true

      - name: Summary
        run: |
          echo "Frontend: https://client-cyan-rho.vercel.app"
          echo "Backend:  https://crm-dashboard-seven-mu.vercel.app"
          echo "Health:   $(curl -s https://crm-dashboard-seven-mu.vercel.app/api/health | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[\"message\"])')"
